[project]
name = "tradesentry"
version = "0.1.0"
description = "Trade Finance Intelligence Layer foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.34,<2",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.8,<3",
  "PyJWT>=2.9,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "rapidfuzz>=3.9,<4",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "rules", "dna", "cross_ibu", "fraud_tbml", "agents"]

[tool.setuptools.package-data]
rules = ["config/*.json"]
dna = ["config/*.json"]
cross_ibu = ["config/*.json"]


[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tradesentry_api", "models", "dna", "cross_ibu", "fraud_tbml", "agents"]
mypy_path = "apps/api"
