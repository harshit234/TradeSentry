services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradesentry
      POSTGRES_USER: tradesentry
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradesentry"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,textract,secretsmanager,kms
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["4566:4566"]
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env.example
      - path: ../../.env
        required: false
    environment:
      SERVICE_CHECK_MODE: live
      AWS_ACCESS_KEY_ID: localstack-test-credential
      AWS_SECRET_ACCESS_KEY: localstack-test-credential
      AWS_EC2_METADATA_DISABLED: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
